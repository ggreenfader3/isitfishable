name: Refresh river data

on:
  schedule:
    - cron: "17 */3 * * *" # refresh flows every 3 hours
    - cron: "7 9 * * *" # nightly, 2:07am Montana time: add the next river from queue.json
  workflow_dispatch:
    inputs:
      add_river:
        description: Add the next river from the queue
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add tonight's river
        if: github.event.schedule == '7 9 * * *' || inputs.add_river
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
        run: |
          node scripts/add-next-river.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rivers.json queue.json data/stats
          if ! git diff --cached --quiet; then
            git commit -m "Add next river from queue"
            git push
          fi

      - name: Build site from live USGS data
        run: node scripts/build.mjs
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  ping-search-engines:
    needs: deploy
    if: github.event.schedule == '7 9 * * *' || inputs.add_river
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tell IndexNow about the new page
        run: node scripts/indexnow.mjs
